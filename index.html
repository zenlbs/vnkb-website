<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VNKB — a native macOS Vietnamese keyboard input method. Just a working keyboard.">
  <meta property="og:title" content="VNKB">
  <meta property="og:description" content="just a working keyboard">
  <meta property="og:type" content="website">
  <title>VNKB</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #111111;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
      position: relative;
    }

    .mark {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 40px;
    }

    .tagline {
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #111111;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 48px;
    }

    .tagline .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: #111111;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.6s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tagline .cursor {
        animation: none;
      }
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.01em;
      border-radius: 6px;
      transition: opacity 0.15s ease;
    }

    .download:hover {
      opacity: 0.75;
    }

    .download svg {
      flex-shrink: 0;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      right: 28px;
    }

    .footer a {
      font-size: 11px;
      font-weight: 400;
      color: #bbbbbb;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.15s ease;
    }

    .footer a:hover {
      color: #888888;
    }

    @media (max-width: 480px) {
      .footer {
        position: static;
        margin-top: 60px;
        text-align: center;
      }

      .page {
        padding-bottom: 48px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="mark">VNKB</p>

    <h1 class="tagline" id="tagline">just a working keyboard</h1>

    <a class="download" href="https://github.com/zenlbs/vnkb/releases/latest/download/VNKB.dmg" download="VNKB.dmg" style="visibility: hidden;" id="download-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M7 1v8M4 6.5l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download
    </a>

    <script>
      (function() {
        var text = 'just a working keyboard';
        var el = document.getElementById('tagline');
        var btn = document.getElementById('download-btn');
        el.textContent = '';
        var span = document.createElement('span');
        var cursor = document.createElement('span');
        cursor.className = 'cursor';
        el.appendChild(span);
        el.appendChild(cursor);
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          span.textContent = text;
          cursor.remove();
          btn.style.visibility = 'visible';
        } else {
          var i = 0;
          var timer = setInterval(function() {
            i++;
            span.textContent = text.slice(0, i);
            if (i >= text.length) {
              clearInterval(timer);
              setTimeout(function() { cursor.remove(); }, 800);
              btn.style.visibility = 'visible';
            }
          }, 60);
        }
      })();
    </script>
  </main>

  <footer class="footer">
    <a href="https://zenlabs.gg" target="_blank" rel="noopener noreferrer">built by zenlabs.gg</a>
  </footer>
</body>
</html>
